<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juniper Salon: your opening</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="phone">
      <p class="eyebrow">Juniper Salon</p>
      <div class="panel">
        <h1 id="title">Loading your offer...</h1>
        <div id="lines" class="lines"></div>
        <p id="note" class="hint"></p>
        <div id="btns" class="btns" hidden>
          <button class="yes" id="yes">Yes, I'll take it</button>
          <button id="no">No thanks</button>
          <button type="button" id="ask" class="link">I have a question</button>
        </div>
        <div id="askbox" hidden>
          <label for="question-text" class="hint">Not sure? Tell us what you'd like to know. Our staff will follow up, and this will not count as a yes.</label>
          <textarea id="question-text" maxlength="280" placeholder="Your question"></textarea>
          <div class="btns"><button id="send-question" class="yes">Send to staff</button></div>
        </div>
        <p id="result" class="result" hidden role="status"></p>
      </div>
      <p class="hint">No account or login needed. This is what a client would see after tapping the link in the text. Prototype: nothing here is connected to a real phone.</p>
    </main>
    <script src="/offer.js"></script>
  </body>
</html>
